# ============================================
# CI — App checks (Mi Platica)
# ============================================
# Pipeline propio de la app móvil (NO el boilerplate KATA de Playwright web).
# Corre lo que SÍ existe y pasa: type-check de TypeScript + los tests de lógica
# (bun test lib). Objetivo: que cada push/PR a main quede verde y atrape errores
# de tipos o lógica antes de mergear.

name: CI

# ── Triggers: cuándo corre ──────────────────────────────────────────────
# push a main → valida lo que ya entró. pull_request → valida ANTES de mergear.
on:
  push:
    branches: [main]
  pull_request:

# Si pusheás de nuevo (mismo ref) antes de que termine la corrida anterior, se
# cancela la vieja y queda sólo la última. Ahorra minutos de CI y evita que un
# resultado viejo "pise" al nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check & logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1) Traer el código del repo a la VM.
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Instalar pnpm (gestor de paquetes de la app). Pin a v11 para matchear
      #    el pnpm-lock.yaml (lockfileVersion 9.0) generado localmente.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # 3) Instalar Node + cachear el store de pnpm (instalaciones más rápidas).
      #    Node 22: pnpm 11 requiere Node >= 22.13 (usa node:sqlite). Con Node 20
      #    el step de caché crashea en `pnpm store path`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 4) Instalar Bun (corre los tests de lógica: `bun test`).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 5) Instalar dependencias EXACTAS del lockfile (falla si el lock está
      #    desactualizado → te obliga a commitear el lock junto al package.json).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 6) Type-check de la app (tsc --noEmit sobre tsconfig.json). NO incluye el
      #    tsconfig de tests KATA, que tiene errores pre-existentes ajenos a la app.
      - name: Type-check (app)
        run: pnpm run type-check:app

      # 7) Tests de lógica pura (bun test lib). Son los ~120 tests de lib/*.test.ts.
      #    Scopeado a lib/ a propósito: el resto de tests/ es KATA Playwright web.
      - name: Logic tests
        run: pnpm run test:unit
