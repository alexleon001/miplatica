<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta confirmada — Mi Plata</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100svh; display: grid; place-items: center;
    background: #0A0D10; color: #F3F6F4; padding: 24px;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    max-width: 420px; width: 100%; text-align: center;
    background: #121619; border: 1px solid #232A2E; border-radius: 20px; padding: 40px 28px;
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
  }
  .badge {
    width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center;
    margin: 0 auto 18px; font-size: 30px;
    background: linear-gradient(135deg, #22A46F, #60E164);
    box-shadow: 0 8px 28px rgba(47,179,137,.4);
  }
  h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }
  p { color: #96A59E; margin-top: 10px; }
  .hint {
    margin-top: 22px; background: #161D1A; border: 1px solid #232A2E;
    border-radius: 12px; padding: 12px 16px; font-size: .92rem; color: #A8E6C9;
  }
  a { color: #46C896; text-decoration: none; }
  footer { margin-top: 26px; font-size: .85rem; color: #6B7280; }
</style>
</head>
<body>
<main class="card">
  <div class="badge" id="icon">✅</div>
  <h1 id="title">¡Tu cuenta está confirmada!</h1>
  <p id="msg">Ya podés cerrar esta página. Volvé a <strong>Mi Plata</strong> en tu teléfono y entrá con tu email y contraseña.</p>
  <div class="hint" id="hint">📱 Abrí la app → tocá <strong>Entrar</strong></div>
  <footer><a href="/">miplatica.vercel.app</a> — Tu plata, con inteligencia.</footer>
</main>
<script>
  // Supabase devuelve errores en el hash (#error=access_denied&error_code=otp_expired…)
  // cuando el enlace venció o ya se usó. Mostramos el estado real, no un falso éxito.
  (function () {
    var h = new URLSearchParams(location.hash.slice(1));
    if (!h.get("error")) return;
    document.getElementById("icon").textContent = "⏳";
    document.getElementById("title").textContent = "Este enlace ya no es válido";
    document.getElementById("msg").innerHTML =
      h.get("error_code") === "otp_expired"
        ? "El enlace de confirmación venció o ya fue usado. Si ya confirmaste antes, simplemente entrá a la app con tu contraseña."
        : "No pudimos procesar el enlace. Probá iniciar sesión en la app: si tu cuenta ya está confirmada, va a funcionar.";
    document.getElementById("hint").innerHTML = "Si no podés entrar, registrate de nuevo desde la app para recibir otro correo.";
  })();
</script>
</body>
</html>
